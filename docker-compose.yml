name: discord-lite

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: discord
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-discord}
      POSTGRES_DB: discord
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    ports:
      # Только для локальной разработки; в бою лучше закомментировать.
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U discord -d discord"]
      interval: 5s
      timeout: 3s
      retries: 20

  livekit:
    image: livekit/livekit-server:v1.8
    restart: unless-stopped
    command: --config /etc/livekit.yaml
    volumes:
      - ./infra/livekit.yaml:/etc/livekit.yaml:ro
    ports:
      - "7880:7880" # HTTP/WebSocket
      - "7881:7881" # RTC TCP (fallback)
      - "50000-50100:50000-50100/udp" # RTC UDP (основной трафик)
    environment:
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY:-devkey}: ${LIVEKIT_API_SECRET:-secret}"

  app:
    image: node:22-alpine
    restart: unless-stopped
    working_dir: /app
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      NODE_ENV: production
      # Внутри compose база доступна по имени сервиса.
      DATABASE_URL: postgresql://discord:${POSTGRES_PASSWORD:-discord}@db:5432/discord
      # Браузеры ходят к LiveKit по публичному wss:// адресу из .env
    volumes:
      - ./:/app
      - /app/node_modules
    command: >
      sh -c "npm ci --no-audit --no-fund &&
             npx prisma db push --skip-generate &&
             npm run build &&
             npm run start"
    ports:
      - "127.0.0.1:3000:3000"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./infra/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./data/caddy:/data
      - ./data/caddy-config:/config
